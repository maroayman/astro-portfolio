<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="sans-serif" role="img" aria-label="Docker containers versus virtual machines architecture comparison">
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Virtual Machines</text>
  <text x="600" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Docker Containers</text>

  <!-- left stack -->
  <rect x="60" y="48" width="280" height="32" fill="#9ca3af"/><text x="200" y="69" text-anchor="middle" font-size="14" fill="#111827">Server Hardware</text>
  <rect x="60" y="84" width="280" height="32" fill="#9ca3af"/><text x="200" y="105" text-anchor="middle" font-size="14" fill="#111827">Host OS</text>
  <rect x="60" y="120" width="280" height="32" fill="#f59e0b"/><text x="200" y="141" text-anchor="middle" font-size="14" fill="#111827">Hypervisor</text>
  <rect x="60" y="156" width="136" height="110" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="128" y="176" text-anchor="middle" font-size="13" fill="#111827">Guest OS</text>
  <line x1="60" y1="184" x2="196" y2="184" stroke="#3b82f6" stroke-width="2"/>
  <text x="128" y="210" text-anchor="middle" font-size="13" fill="#111827">App</text>
  <text x="128" y="230" text-anchor="middle" font-size="13" fill="#111827">Bin/Libs</text>
  <rect x="204" y="156" width="136" height="110" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="272" y="176" text-anchor="middle" font-size="13" fill="#111827">Guest OS</text>
  <line x1="204" y1="184" x2="340" y2="184" stroke="#3b82f6" stroke-width="2"/>
  <text x="272" y="210" text-anchor="middle" font-size="13" fill="#111827">App</text>
  <text x="272" y="230" text-anchor="middle" font-size="13" fill="#111827">Bin/Libs</text>
  <text x="200" y="290" text-anchor="middle" font-size="13" fill="#6b7280">Each VM runs a full OS copy</text>

  <!-- right stack -->
  <rect x="460" y="48" width="280" height="32" fill="#9ca3af"/><text x="600" y="69" text-anchor="middle" font-size="14" fill="#111827">Server Hardware</text>
  <rect x="460" y="84" width="280" height="32" fill="#9ca3af"/><text x="600" y="105" text-anchor="middle" font-size="14" fill="#111827">Host OS (shared kernel)</text>
  <rect x="460" y="120" width="280" height="32" fill="#0db7ed"/><text x="600" y="141" text-anchor="middle" font-size="14" fill="#fff">Docker Engine</text>
  <rect x="460" y="156" width="88" height="110" fill="#e0f2fe" stroke="#0db7ed" stroke-width="2"/>
  <text x="504" y="200" text-anchor="middle" font-size="13" fill="#111827">App</text>
  <text x="504" y="220" text-anchor="middle" font-size="13" fill="#111827">Bin/Libs</text>
  <rect x="556" y="156" width="88" height="110" fill="#e0f2fe" stroke="#0db7ed" stroke-width="2"/>
  <text x="600" y="200" text-anchor="middle" font-size="13" fill="#111827">App</text>
  <text x="600" y="220" text-anchor="middle" font-size="13" fill="#111827">Bin/Libs</text>
  <rect x="652" y="156" width="88" height="110" fill="#e0f2fe" stroke="#0db7ed" stroke-width="2"/>
  <text x="696" y="200" text-anchor="middle" font-size="13" fill="#111827">App</text>
  <text x="696" y="220" text-anchor="middle" font-size="13" fill="#111827">Bin/Libs</text>
  <text x="600" y="290" text-anchor="middle" font-size="13" fill="#6b7280">Containers share the host kernel</text>

  <text x="400" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Result: containers are lighter and start in seconds, VMs in minutes</text>
  <text x="400" y="360" text-anchor="middle" font-size="12" fill="#6b7280">Redrawn for this guide (original third-party hotlink rotted)</text>
</svg>
