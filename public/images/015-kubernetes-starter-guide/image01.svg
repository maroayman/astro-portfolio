<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="sans-serif" role="img" aria-label="Kubernetes NodePort Service traffic flow">
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">NodePort Service</text>

  <rect x="30" y="120" width="130" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="95" y="145" text-anchor="middle" font-size="14" fill="#111827">Client</text>
  <text x="95" y="165" text-anchor="middle" font-size="12" fill="#6b7280">browser / curl</text>

  <line x1="165" y1="150" x2="255" y2="150" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#111827" stroke-width="1.5"/></marker></defs>
  <text x="210" y="138" text-anchor="middle" font-size="12" fill="#111827">&lt;NodeIP&gt;:30080</text>

  <rect x="260" y="60" width="510" height="220" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="515" y="82" text-anchor="middle" font-size="13" fill="#6b7280">Kubernetes Node</text>
  <rect x="280" y="95" width="470" height="48" fill="#bfdbfe"/>
  <text x="515" y="116" text-anchor="middle" font-size="14" fill="#111827">Service (type: NodePort, port 30080 → 80)</text>
  <text x="515" y="134" text-anchor="middle" font-size="12" fill="#6b7280">kube-proxy opens the port on every node</text>
  <rect x="280" y="155" width="228" height="105" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="394" y="180" text-anchor="middle" font-size="14" fill="#111827">Pod A</text>
  <text x="394" y="200" text-anchor="middle" font-size="12" fill="#6b7280">app:80</text>
  <text x="394" y="220" text-anchor="middle" font-size="12" fill="#6b7280">node 1</text>
  <rect x="522" y="155" width="228" height="105" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="636" y="180" text-anchor="middle" font-size="14" fill="#111827">Pod B</text>
  <text x="636" y="200" text-anchor="middle" font-size="12" fill="#6b7280">app:80</text>
  <text x="636" y="220" text-anchor="middle" font-size="12" fill="#6b7280">node 2</text>

  <text x="400" y="310" text-anchor="middle" font-size="12" fill="#6b7280">Redrawn for this guide (original third-party hotlink rotted)</text>
</svg>
